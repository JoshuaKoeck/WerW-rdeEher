<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Wer würde eher?</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="shell admin-shell"><header><a class="brand" href="/">WER WÜRDE <strong>EHER?</strong></a><span class="eyebrow">Spielleitung</span></header><section class="card"><p class="kicker">Rundensteuerung</p><h1>Alles im Blick.</h1><div id="status" class="status"></div><section class="roster admin-roster"><p class="roster-title">Personen im Raum <span id="roster-count">0</span></p><div id="roster-players" class="chips"></div></section><div class="controls"><button id="start" class="primary">Runde starten</button><button id="reveal">Antworten aufdecken</button><button id="next">Nächste Frage</button><button id="reset" class="danger">Neue Spielrunde</button></div><section class="admin-results"><h2>Live-Stand</h2><div id="vote-count" class="vote-count"></div><div id="results"></div></section></section><section class="card"><p class="kicker">Fragenwarteschlange</p><h2>Fragen verwalten</h2><p class="muted">Die aktuelle Frage bleibt während der Runde geschützt. Kommende Fragen können jederzeit entfernt werden.</p><form id="add-question" class="add-question"><input id="new-question" maxlength="180" placeholder="Neue Frage hinzufügen" required><button>Hinzufügen</button></form><div id="question-queue" class="question-queue"></div><p id="admin-error" class="error"></p></section></main><script src="/admin.js"></script></body></html>
