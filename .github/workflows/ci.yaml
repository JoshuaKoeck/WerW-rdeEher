name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to smartalfred
        env:
          SMARTALFRED_TOKEN: ${{ secrets.SMARTALFRED_TOKEN }}
        run: curl -fsSL https://smartalfred.com/deploy.sh | sh -s -- --project d-fine
